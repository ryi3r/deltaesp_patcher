[package]
name = "deltaesp_patcher"
version = "1.0.7"
edition = "2024"
authors = ["ryi3r <itsryi3r@gmail.com>"]

[features]
uninstaller = []
#default = ["uninstaller"]

[dependencies]
sola-raylib = { version = "6.2.0", features = [
    #"wayland",
    "opengl_21",
    #"software_render",
    #"noscreenshot",
    #"sdl",
] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.228"
steamlocate = "2.1.0"
rand = "0.10.1"
parking_lot = "0.12.5"
oxidelta = { git = "https://github.com/sockudo/oxidelta.git" }
whoami = "2.1.2"

[build-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.228"
winresource = "0.1.31"

[package.metadata.winresource]
LegalCopyright = "Equipo DeltaESP & ryi3r @ 2025-2026"

[profile.dev.package."*"]
opt-level = 3
