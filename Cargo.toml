[package]
name = "deltaesp_patcher"
version = "1.0.18"
edition = "2024"
authors = ["ryi3r <itsryi3r@gmail.com>"]

[features]
uninstaller = []
#default = ["uninstaller"]

[dependencies]
sola-raylib = { git = "https://github.com/brettchalupa/sola-raylib.git", branch = "main", features = [
    #"wayland",
    "opengl_21",
    #"software_render",
    #"noscreenshot",
    #"sdl",
] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.228"
steamlocate = "2.1.0"
rand = "0.10.2"
parking_lot = "0.12.5"
oxidelta = { git = "https://github.com/sockudo/oxidelta.git", features = [
    "parallel",
] }
whoami = "2.1.2"
clap = "4.6.2"
log = "0.4.33"
ftail = "0.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[build-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.228"
winresource = "0.1.31"

[package.metadata.winresource]
LegalCopyright = "Equipo DeltaESP & ryi3r @ 2025-2026"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
opt-level = "s"
