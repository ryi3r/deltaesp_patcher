[package]
name = "deltaesp_patcher"
version = "1.0.24"
edition = "2024"
authors = ["ryi3r <itsryi3r@gmail.com>"]

[features]
uninstaller = []
#default = ["uninstaller"]

[dependencies]
sola-raylib = { version = "6.3.1", features = [
    #"wayland",
    "opengl_21",
    #"software_render",
    #"noscreenshot",
    #"sdl",
] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.229"
steamlocate = "2.1.1"
rand = "0.10.3"
parking_lot = "0.13.0"
oxidelta = { git = "https://github.com/sockudo/oxidelta.git", features = [
    "parallel",
] }
whoami = "2.1.3"
clap = "4.6.7"
log = "0.4.34"
ftail = "0.3.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
webbrowser = "1.2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[build-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.229"
winresource = "0.1.34"

[package.metadata.winresource]
LegalCopyright = "Equipo DeltaESP & ryi3r @ 2025-2026"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
opt-level = "s"
